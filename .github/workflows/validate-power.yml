name: Validate OWASP BALS Power

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Power Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate plugin.json is valid JSON
        run: |
          echo "Validando plugin.json..."
          python3 -c "import json; json.load(open('plugin.json'))" && echo "✅ plugin.json es JSON válido"

      - name: Validate required files exist
        run: |
          echo "Verificando archivos requeridos..."
          files=(
            "plugin.json"
            "README.md"
            "POWER.md"
            "LICENSE"
            "CHANGELOG.md"
            "skills/owasp-security-testing/SKILL.md"
            "com.amazon.aws/kiro/kiro.json"
            "com.amazon.aws/kiro/README.md"
            "EXAMPLES.md"
            "templates/hallazgo-tecnico.md"
            "templates/reporte-ejecutivo.md"
            "templates/plan-remediacion.md"
            "steering/owasp-security-testing.md"
            "skills/owasp-security-testing/references/checklist.md"
            "skills/owasp-security-testing/references/payloads.md"
            "skills/owasp-security-testing/references/compliance-mapping.md"
            "skills/owasp-security-testing/references/code-review.md"
            "skills/owasp-security-testing/references/remediation.md"
            "skills/owasp-security-testing/references/cvss.md"
            "skills/owasp-security-testing/references/api-security.md"
            "skills/owasp-security-testing/references/reporting.md"
            "skills/owasp-security-testing/references/scanning.md"
            "evals/cases.md"
            "reports/README.md"
            "scripts/md-to-pdf.mjs"
            "scripts/package-lock.json"
          )
          all_ok=true
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file"
            else
              echo "❌ FALTA: $file"
              all_ok=false
            fi
          done
          if [ "$all_ok" = false ]; then
            echo ""
            echo "ERROR: Hay archivos faltantes. Revisa la lista anterior."
            exit 1
          fi
          echo ""
          echo "✅ Todos los archivos requeridos están presentes."

      - name: Validate plugin.json required fields
        run: |
          echo "Validando campos requeridos en plugin.json..."
          python3 << 'EOF'
          import json, sys

          with open('plugin.json') as f:
              data = json.load(f)

          required = ['name', 'version', 'displayName', 'description', 'license', 'author', 'keywords']
          missing = [field for field in required if field not in data]

          if missing:
              print(f"❌ Campos faltantes en plugin.json: {missing}")
              sys.exit(1)

          if not isinstance(data['keywords'], list) or len(data['keywords']) == 0:
              print("❌ keywords debe ser una lista no vacía")
              sys.exit(1)

          if len(data['description']) < 50:
              print("⚠️  La descripción es muy corta (menos de 50 caracteres)")

          print("✅ plugin.json tiene todos los campos requeridos")
          print(f"   - Nombre: {data['name']}")
          print(f"   - Versión: {data['version']}")
          print(f"   - Keywords: {len(data['keywords'])} keywords")
          EOF

      - name: Validate kiro.json
        run: |
          echo "Validando com.amazon.aws/kiro/kiro.json..."
          python3 -c "import json; json.load(open('com.amazon.aws/kiro/kiro.json'))" && echo "✅ kiro.json es JSON válido"

      - name: Validate SKILL.md frontmatter (Agent Skills)
        run: |
          python3 << 'EOF'
          import re, sys, os

          path = 'skills/owasp-security-testing/SKILL.md'
          text = open(path, encoding='utf-8').read()
          m = re.match(r'^---\r?\n(.*?)\r?\n---\r?\n', text, re.S)
          if not m:
              print("❌ SKILL.md sin frontmatter YAML"); sys.exit(1)
          fm = m.group(1)

          name = re.search(r'^name:\s*(.+)$', fm, re.M)
          desc = re.search(r'^description:\s*(.+)$', fm, re.M)
          errors = []
          if not name:
              errors.append("falta 'name'")
          else:
              n = name.group(1).strip().strip('"\'')
              if not re.fullmatch(r'[a-z0-9]+(-[a-z0-9]+)*', n) or len(n) > 64:
                  errors.append(f"'name' inválido: {n!r} (minúsculas y guiones, máx 64)")
              if n != os.path.basename(os.path.dirname(path)):
                  errors.append(f"'name' ({n}) debe coincidir con la carpeta")
          if not desc:
              errors.append("falta 'description'")
          elif len(desc.group(1).strip()) > 1024:
              errors.append("'description' supera 1024 caracteres")

          if errors:
              for e in errors: print("❌", e)
              sys.exit(1)
          print("✅ Frontmatter de SKILL.md válido")
          EOF

      - name: Validate POWER.md frontmatter and version consistency
        run: |
          python3 << 'EOF'
          import re, json, sys

          power = open('POWER.md', encoding='utf-8').read()
          m = re.match(r'^---\r?\n(.*?)\r?\n---', power, re.S)
          if not m:
              print("❌ POWER.md sin frontmatter"); sys.exit(1)
          fm = m.group(1)
          for key in ('name', 'displayName', 'description', 'keywords'):
              if not re.search(rf'^{key}:', fm, re.M):
                  print(f"❌ POWER.md: falta '{key}'"); sys.exit(1)

          versions = {
              'POWER.md': re.search(r'^version:\s*"?([\d.]+)"?', fm, re.M).group(1),
              'plugin.json': json.load(open('plugin.json'))['version'],
              'kiro.json': json.load(open('com.amazon.aws/kiro/kiro.json'))['version'],
          }
          if len(set(versions.values())) != 1:
              print("❌ Versiones inconsistentes:", versions); sys.exit(1)
          print("✅ POWER.md válido y versiones consistentes:", versions)
          EOF

      - name: Validate hooks examples are valid JSON
        run: |
          for f in examples/hooks/*.json; do
            python3 -c "import json,sys; d=json.load(open('$f')); assert d['version']=='v1' and d['hooks']" \
              && echo "✅ $f" || { echo "❌ $f inválido"; exit 1; }
          done

      - name: Validate every report has md and pdf
        run: |
          fail=0
          for md in reports/20*.md; do
            [ -f "${md%.md}.pdf" ] && echo "✅ $md + pdf" || { echo "❌ falta PDF para $md"; fail=1; }
          done
          exit $fail

      - name: Check for broken internal links
        run: |
          echo "Verificando enlaces internos en POWER.md y README.md..."
          python3 << 'EOF'
          import re, os

          import sys

          files_to_check = [
              'POWER.md', 'README.md', 'reports/README.md', 'EXAMPLES.md',
              'skills/owasp-security-testing/SKILL.md',
          ]
          broken = []

          for fname in files_to_check:
              if not os.path.exists(fname):
                  continue
              base = os.path.dirname(fname)
              with open(fname, encoding='utf-8') as f:
                  content = f.read()
              for link in re.findall(r'\]\((\.[^)#\s]*)\)', content):
                  path = os.path.normpath(os.path.join(base, link))
                  if not os.path.exists(path):
                      broken.append(f"{fname}: {link}")

          if broken:
              print("❌ Enlaces internos rotos:")
              for b in broken:
                  print(f"   - {b}")
              sys.exit(1)
          print("✅ No se detectaron enlaces internos rotos")
          EOF

      - name: Summary
        if: success()
        run: echo "OWASP BALS Power — Validación OK"
